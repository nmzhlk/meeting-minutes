services:
  db:
    image: postgres:18-alpine
    container_name: meeting_minutes_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meeting_minutes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD pg_isready -U postgres -d meeting_minutes"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
