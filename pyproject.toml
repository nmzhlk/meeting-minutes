[tool.ruff]
line-length = 88
target-version = "py314"

src = ["backend"]

extend-exclude = [
    "frontend",
    "backend/venv",
    ".venv",
    ".pytest_cache",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.mypy]
python_version = "3.12"
python_executable = "backend/venv/bin/python"

strict = true

ignore_missing_imports = true